[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-manager-api"
version = "0.3.0"
description = "Multi-platform WireGuard management API for RouterOS and Linux"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0", "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0",
  "cryptography>=43,<47", "httpx>=0.27,<1.0", "alembic>=1.13,<2.0", "qrcode[pil]>=8.0,<9.0", "asyncssh>=2.20,<3.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]
[tool.setuptools]
package-dir = {"" = "backend"}
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
