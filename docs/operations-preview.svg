<rect x="610" y="100" width="555" height="295" rx="12" fill="#11182a" stroke="#293249"/><text x="633" y="131" fill="#8e9ab3" font-size="9" font-weight="700" letter-spacing="1.3">PAGE 05 / DIAGNOSTICS</text><text x="633" y="160" fill="#edf0fa" font-size="18" font-weight="700">Demo diagnostics</text><text x="633" y="179" fill="#8490aa" font-size="10">Run checks against the local sample dataset</text><rect x="1015" y="144" width="126" height="28" rx="7" fill="#8272f0"/><text x="1030" y="162" fill="#fff" font-size="10" font-weight="700">▶ Run checks</text><g font-size="11"><circle cx="645" cy="213" r="7" fill="#15312c"/><text x="642" y="217" fill="#6fdbb6">✓</text><text x="663" y="217" fill="#dce3f2">Router inventory</text><text x="1090" y="217" fill="#6fdbb6">Passed</text><path d="M633 233H1142" stroke="#222c41"/><circle cx="645" cy="252" r="7" fill="#15312c"/><text x="642" y="256" fill="#6fdbb6">✓</text><text x="663" y="256" fill="#dce3f2">Peer address conflicts</text><text x="1090" y="256" fill="#6fdbb6">Passed</text><path d="M633 272H1142" stroke="#222c41"/><circle cx="645" cy="291" r="7" fill="#3a3020"/><text x="642" y="295" fill="#e7c27e">!</text><text x="663" y="295" fill="#dce3f2">Interface health</text><text x="1080" y="295" fill="#e7c27e">Warning</text><path d="M633 311H1142" stroke="#222c41"/><circle cx="645" cy="330" r="7" fill="#3a3020"/><text x="642" y="334" fill="#e7c27e">!</text><text x="663" y="334" fill="#dce3f2">Handshake freshness</text><text x="1080" y="334" fill="#e7c27e">Warning</text></g><text x="633" y="370" fill="#8490aa" font-size="10">Simulated results; no router or network probes are executed.</text>
