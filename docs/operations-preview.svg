<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">WireGuard Manager operations pages preview</title><desc id="desc">Four interface previews for traffic analytics, diagnostics, audit log and settings using synthetic demo information.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#121a2c"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9585ff"/><stop offset="1" stop-color="#6757d8"/></linearGradient></defs><rect width="1200" height="760" rx="18" fill="url(#bg)"/><text x="40" y="48" fill="#f0f2fb" font-family="Arial" font-size="24" font-weight="700">WireGuard Manager <tspan fill="#a596ff" font-size="15">/ Operations views</tspan></text><text x="40" y="72" fill="#8490aa" font-family="Arial" font-size="12">Separate demo screens · Illustrative data only · No live router connection</text>
